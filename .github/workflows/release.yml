name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json and manifest.json versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          man=$(node -p "require('./src/manifest.json').version")
          echo "tag=$tag package=$pkg manifest=$man"
          test "$tag" = "$pkg" && test "$tag" = "$man"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack
      - name: Create GitHub release with the plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" todoist-sync-*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
